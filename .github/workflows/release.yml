name: Build workflow-statusbar

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-macos:
    name: Build macOS (app + dmg)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: workflow-statusbar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release version (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          TAURI_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).version")"
          CARGO_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          echo "package.json version: ${PKG_VERSION}"
          echo "tauri.conf.json version: ${TAURI_VERSION}"
          echo "Cargo.toml version: ${CARGO_VERSION}"
          echo "tag version: ${TAG_VERSION}"

          if [[ -z "${CARGO_VERSION}" ]]; then
            echo "Cargo.toml version not found."
            exit 1
          fi

          if [[ "${PKG_VERSION}" != "${TAURI_VERSION}" || "${PKG_VERSION}" != "${CARGO_VERSION}" ]]; then
            echo "Version mismatch across package.json / tauri.conf.json / Cargo.toml."
            exit 1
          fi

          if [[ "${PKG_VERSION}" != "${TAG_VERSION}" ]]; then
            echo "Tag version must match app version. Expected v${PKG_VERSION}, got ${GITHUB_REF_NAME}."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: workflow-statusbar/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build macOS bundles
        run: npm run package:mac

      - name: Validate macOS signing secrets (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          APPLE_DEVELOPER_ID_CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12_BASE64 }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_DEVELOPER_ID_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          for key in \
            APPLE_DEVELOPER_ID_CERT_P12_BASE64 \
            APPLE_DEVELOPER_ID_CERT_PASSWORD \
            APPLE_DEVELOPER_ID_IDENTITY \
            APPLE_ID \
            APPLE_TEAM_ID \
            APPLE_APP_SPECIFIC_PASSWORD; do
            if [[ -z "${!key}" ]]; then
              echo "Missing required secret: ${key}"
              exit 1
            fi
          done

      - name: Sign and notarize macOS app (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        id: notarize
        shell: bash
        env:
          APPLE_DEVELOPER_ID_CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12_BASE64 }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_DEVELOPER_ID_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail

          PRODUCT_NAME="$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).productName")"
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).version")"
          ARCH="$(uname -m)"

          APP_PATH="src-tauri/target/release/bundle/macos/${PRODUCT_NAME}.app"
          DMG_DIR="src-tauri/target/release/bundle/dmg"
          NOTARIZED_DMG_PATH="${DMG_DIR}/${PRODUCT_NAME}_${VERSION}_${ARCH}-notarized.dmg"

          if [[ ! -d "${APP_PATH}" ]]; then
            echo "App bundle not found: ${APP_PATH}"
            exit 1
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"

          echo "${APPLE_DEVELOPER_ID_CERT_P12_BASE64}" | base64 --decode > "${CERT_PATH}"
          security create-keychain -p "" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "" "${KEYCHAIN_PATH}"
          security import "${CERT_PATH}" \
            -k "${KEYCHAIN_PATH}" \
            -P "${APPLE_DEVELOPER_ID_CERT_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security list-keychains -d user -s "${KEYCHAIN_PATH}" login.keychain-db
          security find-identity -v -p codesigning "${KEYCHAIN_PATH}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "${KEYCHAIN_PATH}"

          codesign --force --deep --options runtime --sign "${APPLE_DEVELOPER_ID_IDENTITY}" "${APP_PATH}"
          codesign --verify --deep --strict --verbose=2 "${APP_PATH}"
          xcrun stapler staple "${APP_PATH}"

          mkdir -p "${DMG_DIR}"
          rm -f "${NOTARIZED_DMG_PATH}"
          hdiutil create -volname "${PRODUCT_NAME}" -srcfolder "${APP_PATH}" -ov -format UDZO "${NOTARIZED_DMG_PATH}"

          xcrun notarytool submit "${NOTARIZED_DMG_PATH}" \
            --apple-id "${APPLE_ID}" \
            --team-id "${APPLE_TEAM_ID}" \
            --password "${APPLE_APP_SPECIFIC_PASSWORD}" \
            --wait
          xcrun stapler staple "${NOTARIZED_DMG_PATH}"
          xcrun stapler validate "${NOTARIZED_DMG_PATH}"

          echo "app_path=${APP_PATH}" >> "$GITHUB_OUTPUT"
          echo "dmg_path=${NOTARIZED_DMG_PATH}" >> "$GITHUB_OUTPUT"

      - name: Build metadata
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "suffix=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "suffix=dev-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload macOS artifacts (tag release)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: workflow-statusbar-macos-${{ steps.meta.outputs.suffix }}
          if-no-files-found: error
          path: |
            workflow-statusbar/${{ steps.notarize.outputs.app_path }}
            workflow-statusbar/${{ steps.notarize.outputs.dmg_path }}

      - name: Upload macOS artifacts (dev)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: workflow-statusbar-macos-${{ steps.meta.outputs.suffix }}
          if-no-files-found: error
          path: |
            workflow-statusbar/src-tauri/target/release/bundle/macos/*.app
            workflow-statusbar/src-tauri/target/release/bundle/dmg/*.dmg

  build-windows:
    name: Build Windows (nsis + msi)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: workflow-statusbar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release version (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          TAURI_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).version")"
          CARGO_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          echo "package.json version: ${PKG_VERSION}"
          echo "tauri.conf.json version: ${TAURI_VERSION}"
          echo "Cargo.toml version: ${CARGO_VERSION}"
          echo "tag version: ${TAG_VERSION}"

          if [[ -z "${CARGO_VERSION}" ]]; then
            echo "Cargo.toml version not found."
            exit 1
          fi

          if [[ "${PKG_VERSION}" != "${TAURI_VERSION}" || "${PKG_VERSION}" != "${CARGO_VERSION}" ]]; then
            echo "Version mismatch across package.json / tauri.conf.json / Cargo.toml."
            exit 1
          fi

          if [[ "${PKG_VERSION}" != "${TAG_VERSION}" ]]; then
            echo "Tag version must match app version. Expected v${PKG_VERSION}, got ${GITHUB_REF_NAME}."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: workflow-statusbar/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows bundles
        run: npm run package:win

      - name: Build metadata
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "suffix=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "suffix=dev-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: workflow-statusbar-windows-${{ steps.meta.outputs.suffix }}
          if-no-files-found: error
          path: |
            workflow-statusbar/src-tauri/target/release/bundle/nsis/*.exe
            workflow-statusbar/src-tauri/target/release/bundle/msi/*.msi
