name: Build workflow-statusbar

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-macos:
    name: Build macOS (app + dmg)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: workflow-statusbar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release version (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          TAURI_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).version")"
          CARGO_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          echo "package.json version: ${PKG_VERSION}"
          echo "tauri.conf.json version: ${TAURI_VERSION}"
          echo "Cargo.toml version: ${CARGO_VERSION}"
          echo "tag version: ${TAG_VERSION}"

          if [[ -z "${CARGO_VERSION}" ]]; then
            echo "Cargo.toml version not found."
            exit 1
          fi

          if [[ "${PKG_VERSION}" != "${TAURI_VERSION}" || "${PKG_VERSION}" != "${CARGO_VERSION}" ]]; then
            echo "Version mismatch across package.json / tauri.conf.json / Cargo.toml."
            exit 1
          fi

          if [[ "${PKG_VERSION}" != "${TAG_VERSION}" ]]; then
            echo "Tag version must match app version. Expected v${PKG_VERSION}, got ${GITHUB_REF_NAME}."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: workflow-statusbar/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build macOS bundles
        run: npm run package:mac

      - name: Build metadata
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "suffix=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "suffix=dev-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: workflow-statusbar-macos-${{ steps.meta.outputs.suffix }}
          if-no-files-found: error
          path: |
            workflow-statusbar/src-tauri/target/release/bundle/macos/*.app
            workflow-statusbar/src-tauri/target/release/bundle/dmg/*.dmg

  build-windows:
    name: Build Windows (nsis + msi)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: workflow-statusbar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release version (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          TAURI_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).version")"
          CARGO_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          echo "package.json version: ${PKG_VERSION}"
          echo "tauri.conf.json version: ${TAURI_VERSION}"
          echo "Cargo.toml version: ${CARGO_VERSION}"
          echo "tag version: ${TAG_VERSION}"

          if [[ -z "${CARGO_VERSION}" ]]; then
            echo "Cargo.toml version not found."
            exit 1
          fi

          if [[ "${PKG_VERSION}" != "${TAURI_VERSION}" || "${PKG_VERSION}" != "${CARGO_VERSION}" ]]; then
            echo "Version mismatch across package.json / tauri.conf.json / Cargo.toml."
            exit 1
          fi

          if [[ "${PKG_VERSION}" != "${TAG_VERSION}" ]]; then
            echo "Tag version must match app version. Expected v${PKG_VERSION}, got ${GITHUB_REF_NAME}."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: workflow-statusbar/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows bundles
        run: npm run package:win

      - name: Build metadata
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "suffix=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "suffix=dev-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: workflow-statusbar-windows-${{ steps.meta.outputs.suffix }}
          if-no-files-found: error
          path: |
            workflow-statusbar/src-tauri/target/release/bundle/nsis/*.exe
            workflow-statusbar/src-tauri/target/release/bundle/msi/*.msi
