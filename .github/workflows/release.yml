name: Build workflow-statusbar

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-macos:
    name: Build macOS (app + dmg)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: workflow-statusbar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: workflow-statusbar/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build macOS bundles
        run: npm run package:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: workflow-statusbar-macos
          if-no-files-found: error
          path: |
            workflow-statusbar/src-tauri/target/release/bundle/macos/*.app
            workflow-statusbar/src-tauri/target/release/bundle/dmg/*.dmg

  build-windows:
    name: Build Windows (nsis + msi)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: workflow-statusbar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: workflow-statusbar/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows bundles
        run: npm run package:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: workflow-statusbar-windows
          if-no-files-found: error
          path: |
            workflow-statusbar/src-tauri/target/release/bundle/nsis/*.exe
            workflow-statusbar/src-tauri/target/release/bundle/msi/*.msi
